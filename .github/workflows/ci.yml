name: Portfolio CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start portfolio
        run: docker compose up -d

      - name: Wait for Nginx
        run: sleep 5

      - name: Test portfolio
        run: curl --fail http://localhost:8083

      - name: Verify OWASP D01 - Non-root User
        run: |
          echo "Checking container UID..."
          docker compose exec -T portfolio id

          echo "Verifying non-root user..."
          docker compose exec -T portfolio sh -c 'test "$(id -u)" -eq 101'

          echo "Checking privilege escalation protection..."
          docker compose exec -T portfolio sh -c 'grep -q "^NoNewPrivs:[[:space:]]*1" /proc/self/status'

          echo "OWASP D01 verification passed!"


      - name: Show running containers
        run: docker compose ps

      - name: Stop portfolio
        if: always()
        run: docker compose down